<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Bleeding Full 512x512 -->
    <linearGradient id="bgMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041410" />
      <stop offset="45%" stop-color="#08221B" />
      <stop offset="100%" stop-color="#020E0B" />
    </linearGradient>

    <!-- Agritech Vibrant Emerald Gradient -->
    <linearGradient id="emeraldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Tech Cyan Gradient for Analytics & Connectivity -->
    <linearGradient id="cyanGradM" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Soft Rose / Tech Blush Gradient for Swine Identity -->
    <linearGradient id="roseGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3" />
      <stop offset="50%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <linearGradient id="roseSoftGradM" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="60%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <!-- Golden Metric Spark for Cargill Curves & Nutrition -->
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtleM" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgMaskGrad)" />

  <!-- Subtle Precision Grid Lines -->
  <g opacity="0.08" stroke="#10B981" stroke-width="1.5">
    <line x1="80" y1="160" x2="432" y2="160" stroke-dasharray="6,6" />
    <line x1="80" y1="256" x2="432" y2="256" stroke-dasharray="6,6" />
    <line x1="80" y1="352" x2="432" y2="352" stroke-dasharray="6,6" />
    <line x1="160" y1="80" x2="160" y2="432" stroke-dasharray="6,6" />
    <line x1="256" y1="80" x2="256" y2="432" stroke-dasharray="6,6" />
    <line x1="352" y1="80" x2="352" y2="432" stroke-dasharray="6,6" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="260" cy="245" r="130" fill="#10B981" opacity="0.10" filter="url(#glowM)" />
  <circle cx="375" cy="225" r="80" fill="#FB7185" opacity="0.12" filter="url(#glowM)" />
  <circle cx="340" cy="180" r="65" fill="#0EA5E9" opacity="0.12" filter="url(#glowM)" />

  <!-- MAIN EMBLEM -->
  <g id="swine-pig-mark-mask">
    <!-- Back Neck Geometric Facet -->
    <path d="M130 325 L170 248 L225 295 L195 365 Z" fill="#064E3B" opacity="0.9" />

    <!-- Lower Jaw Facet -->
    <path d="M195 365 L225 295 L305 330 L265 395 Z" fill="#047857" opacity="0.9" />

    <!-- Forehead & Ear Geometric Crown -->
    <path d="M215 145 L272 95 L298 175 L232 198 Z" fill="url(#emeraldGradM)" />
    
    <!-- INNER EAR: Soft Rose Accent -->
    <path d="M272 95 L292 140 L255 152 Z" fill="url(#roseGradM)" opacity="0.95" filter="url(#glow-subtleM)" />
    <path d="M272 95 L284 125 L262 135 Z" fill="#FECDD3" opacity="0.7" />

    <!-- Central Head Facet -->
    <path d="M170 248 L232 198 L298 175 L320 240 L225 295 Z" fill="#059669" />

    <!-- Brow to Snout Ridge -->
    <path d="M298 175 L372 208 L345 278 L320 240 Z" fill="url(#emeraldGradM)" />

    <!-- Snout Bridge -->
    <path d="M372 208 L405 222 L378 282 L345 278 Z" fill="url(#cyanGradM)" />

    <!-- SNOUT FRONT PAD: Soft Gentle Rose -->
    <path d="M405 222 L424 235 L405 284 L378 282 Z" fill="url(#roseSoftGradM)" filter="url(#glow-subtleM)" />
    <path d="M424 235 L405 284" stroke="#FECDD3" stroke-width="2.8" stroke-linecap="round" opacity="0.9" />

    <!-- Nostril Nodes -->
    <circle cx="409" cy="245" r="4" fill="#881337" opacity="0.8" />
    <circle cx="408" cy="244" r="2.5" fill="#FDA4AF" />
    <circle cx="401" cy="266" r="4" fill="#881337" opacity="0.8" />
    <circle cx="400" cy="265" r="2.5" fill="#FDA4AF" />

    <!-- Cheek Connector -->
    <path d="M320 240 L345 278 L305 330 L225 295 Z" fill="#0F766E" />
    <path d="M345 278 L378 282 L358 330 L305 330 Z" fill="#115E59" />

    <!-- Telemetry Eye -->
    <polygon points="280,227 296,218 312,227 312,245 296,254 280,245" fill="#061A14" stroke="#34D399" stroke-width="2.8" />
    <circle cx="296" cy="236" r="4.5" fill="url(#goldGradM)" filter="url(#glow-subtleM)" />
    <circle cx="294" cy="234" r="1.5" fill="#FFFFFF" />

    <!-- ASCENDING CARGILL PERFORMANCE ANALYTICS CURVE -->
    <path d="M105 378 C150 368, 195 340, 230 295 C272 235, 305 188, 412 135" 
          fill="none" 
          stroke="url(#cyanGradM)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          filter="url(#glowM)" />

    <path d="M105 378 C150 368, 195 340, 230 295 C272 235, 305 188, 412 135" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          opacity="0.95" />

    <!-- Growth Peak Arrow -->
    <circle cx="412" cy="135" r="8" fill="url(#goldGradM)" filter="url(#glowM)" />
    <circle cx="412" cy="135" r="3.5" fill="#FFFFFF" />
    <path d="M398 126 L424 126 L424 152" fill="none" stroke="#FDE047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Telemetry Nodes along Curve -->
    <g>
      <circle cx="170" cy="360" r="4.5" fill="#10B981" />
      <circle cx="230" cy="295" r="5" fill="url(#roseGradM)" />
      <circle cx="230" cy="295" r="2.5" fill="#FFFFFF" />
      <circle cx="305" cy="215" r="5" fill="#38BDF8" />
      <circle cx="355" cy="172" r="5.5" fill="#F59E0B" />
    </g>

    <!-- Lower Horizon Tech Bar -->
    <rect x="150" y="415" width="212" height="5.5" rx="2.75" fill="#064E3B" />
    <rect x="150" y="415" width="120" height="5.5" rx="2.75" fill="url(#emeraldGradM)" />
    <rect x="270" y="415" width="30" height="5.5" rx="2.75" fill="url(#roseGradM)" />
    <circle cx="300" cy="417.75" r="4" fill="url(#goldGradM)" />
  </g>
</svg>
